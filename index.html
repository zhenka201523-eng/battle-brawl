
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATTLE BRAWL</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle,#383866,#111120);color:white;font-family:Arial;display:flex;justify-content:center;align-items:center}
.panel{width:min(920px,96%);min-height:90vh;padding:22px;background:#20203a;border:3px solid #6868a5;border-radius:22px;display:flex;flex-direction:column;gap:16px}
h1{text-align:center;color:#ffe36e;font-size:clamp(32px,7vw,55px);margin:5px}
h2{text-align:center}
button{padding:13px;border:0;border-radius:12px;background:#ffca4b;color:#29203b;font-size:17px;font-weight:bold;cursor:pointer}
.secondary{background:#7777d5;color:white}
.menu{display:grid;gap:12px;max-width:400px;width:100%;margin:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.fighter,.player{background:#303052;border:2px solid #66669a;border-radius:15px;padding:14px;text-align:center}
.emoji{font-size:48px}
.fighter p{color:#ddd}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.avatar{font-size:clamp(55px,12vw,95px)}
.hp{height:14px;background:#6b293b;border-radius:20px;overflow:hidden;margin:8px 0}
.hp div{height:100%;background:#55dc83;transition:.2s}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.status{text-align:center;color:#ffe36e;min-height:25px;font-weight:bold}
.hidden{display:none!important}
footer{text-align:center;color:#aaa;font-size:12px;margin-top:auto}
button:disabled{opacity:.5}
@media(orientation:landscape) and (max-height:600px){
.panel{min-height:96vh;padding:10px 20px;gap:9px}
.avatar{font-size:48px}.fighter{padding:8px}.emoji{font-size:34px}
button{padding:9px}
}
@media(max-width:500px){
.panel{padding:14px}
.actions{grid-template-columns:1fr 1fr}
.actions button:last-child{grid-column:span 2}
.player{padding:9px 4px}
}
</style>
</head>
<body>
<main class="panel">
<h1>BATTLE BRAWL</h1>

<section id="home">
<p style="text-align:center">Вітаємо на арені!</p>
<div class="menu">
<button onclick="show('fighters')">⚔️ Бійці</button>
<button onclick="startBattle()">🎮 Грати</button>
</div>
</section>

<section id="fighters" class="hidden">
<h2>Обери бійця</h2>
<div class="cards" id="fighterCards"></div>
<button class="secondary" onclick="show('home')">⬅ Назад</button>
</section>

<section id="battle" class="hidden">
<h2>⚔️ БІЙ!</h2>
<div class="arena">
<div class="player">
<div id="heroEmoji" class="avatar">🐱</div>
<b id="heroName"></b>
<div class="hp"><div id="heroBar"></div></div>
<span id="heroHp"></span>
</div>
<div class="player">
<div class="avatar">👾</div>
<b>Суперник</b>
<div class="hp"><div id="enemyBar"></div></div>
<span id="enemyHp"></span>
</div>
</div>
<div class="status" id="status">Твій хід!</div>
<div class="actions">
<button id="attackBtn" onclick="attack()">👊 Атака</button>
<button id="specialBtn" onclick="special()">💥 Суператака</button>
<button id="defendBtn" class="secondary" onclick="defend()">🛡️ Захист</button>
</div>
<div class="menu">
<button id="again" class="hidden" onclick="startBattle()">🔄 Ще раз</button>
<button class="secondary" onclick="show('home')">🏠 Меню</button>
</div>
</section>
<footer>BATTLE BRAWL • VERSION 2.0</footer>
</main>

<script>
const fighters=[
{name:"Меоад",rarity:"Стартовий",emoji:"🐱",atk:2,hp:30},
{name:"Джемені",rarity:"Супер рідкісний",emoji:"💎",atk:45,hp:56},
{name:"Жед",rarity:"Міфічний",emoji:"🐉",atk:68,hp:100},
{name:"Chat GPT",rarity:"Легендарний",emoji:"🤖",atk:95,hp:300}
];

let chosen=0,hero=30,maxHero=30,enemy=100,maxEnemy=100;
let guarding=false,usedSpecial=false,ended=false,busy=false;
let turn=0;

const el=id=>document.getElementById(id);

function show(id){
["home","fighters","battle"].forEach(x=>{
el(x).classList.toggle("hidden",x!==id);
});
}

function renderFighters(){
el("fighterCards").innerHTML=fighters.map((f,i)=>`
<div class="fighter">
<div class="emoji">${f.emoji}</div>
<b>${f.name}</b>
<p>${f.rarity}</p>
<p>⚔️ ${f.atk} | ❤️ ${f.hp}</p>
<button onclick="choose(${i})">${chosen===i?"Обрано ✓":"Обрати"}</button>
</div>`).join("");
}

function choose(i){
chosen=i;
renderFighters();
}

function update(){
el("heroHp").textContent=hero+" / "+maxHero;
el("enemyHp").textContent=enemy+" / "+maxEnemy;
el("heroBar").style.width=(hero/maxHero*100)+"%";
el("enemyBar").style.width=(enemy/maxEnemy*100)+"%";
}

function buttons(disabled){
["attackBtn","specialBtn","defendBtn"].forEach(id=>{
el(id).disabled=disabled;
});
}

function startBattle(){
let f=fighters[chosen];
turn++;
maxHero=hero=f.hp;
maxEnemy=enemy=100;
guarding=false;
usedSpecial=false;
ended=false;
busy=false;
el("heroEmoji").textContent=f.emoji;
el("heroName").textContent=f.name;
el("status").textContent="Твій хід!";
el("again").classList.add("hidden");
buttons(false);
update();
show("battle");
}

function finish(message){
ended=true;
busy=false;
buttons(true);
el("status").textContent=message;
el("again").classList.remove("hidden");
}

function enemyTurn(){
if(ended)return;
let damage=guarding?6:12;
guarding=false;
hero=Math.max(0,hero-damage);
update();
busy=false;
if(hero<=0){
finish("Ти програв! Спробуй ще раз.");
}else{
el("status").textContent="Суперник атакував. Твій хід!";
buttons(false);
}
}

function playerAttack(damage,message){
if(ended||busy)return;
busy=true;
buttons(true);
enemy=Math.max(0,enemy-damage);
update();
if(enemy<=0){
finish("Перемога! 🏆");
return;
}
el("status").textContent=message;
setTimeout(enemyTurn,600);
}

function attack(){
playerAttack(fighters[chosen].atk,"Ти атакував!");
}

function special(){
if(ended||busy||usedSpecial)return;
usedSpecial=true;
el("specialBtn").textContent="💥 Використано";
playerAttack(Math.round(fighters[chosen].atk*1.8),"Суператака!");
}

function defend(){
if(ended||busy)return;
busy=true;
guarding=true;
buttons(true);
el("status").textContent="Захист активовано!";
setTimeout(enemyTurn,600);
}

renderFighters();
show("home");
</script>
</body>
</html>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js")
      .then(() => console.log("BATTLE BRAWL PWA готова!"))
      .catch(error => console.error("Помилка PWA:", error));
  });
}
</script>
