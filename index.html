
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#21143b">
<link rel="manifest" href="./manifest.webmanifest">
<title>BATTLE BRAWL 2.2</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #100b20, #28164b, #111a30);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 25px 10px;
  background: #1c1235;
  border-bottom: 3px solid #a34cff;
}

header h1 {
  margin: 0;
  color: #d9a5ff;
  font-size: 34px;
  text-shadow: 0 0 15px #9b42ff;
}

header p {
  color: #c9b8df;
}

#currency {
  text-align: center;
  margin: 15px;
  padding: 12px;
  background: #352052;
  border: 1px solid #a34cff;
  border-radius: 12px;
  font-size: 19px;
}

main {
  width: min(95%, 650px);
  margin: 20px auto;
}

.screen {
  display: none;
}

.screen.active {
  display: block;
}

h2 {
  text-align: center;
  color: #d9a5ff;
}

.menu-button {
  display: block;
  width: 100%;
  padding: 17px;
  margin: 12px 0;
  border: 2px solid #a34cff;
  border-radius: 14px;
  background: linear-gradient(135deg, #482477, #29204b);
  color: white;
  font-size: 19px;
  font-weight: bold;
  cursor: pointer;
}

.menu-button:active {
  transform: scale(.97);
}

.back {
  background: #302344;
  border-color: #75618e;
}

.card {
  background: #241a3a;
  border: 1px solid #7950a9;
  border-radius: 15px;
  padding: 15px;
  margin: 12px 0;
  text-align: center;
}

.card h3 {
  color: #d9a5ff;
}

footer {
  text-align: center;
  padding: 20px;
  color: #a99bbd;
}

@media (orientation: landscape) {
  main {
    max-width: 900px;
  }

  #fighters-list,
  #shop-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>⚔️ BATTLE BRAWL</h1>
  <p>HALLOWEEN UPDATE — VERSION 2.2</p>
</header>

<div id="currency">
  💜 Flayyers: <span id="coins">0</span>
</div>

<main>

<section id="menu" class="screen active">
  <h2>ГОЛОВНЕ МЕНЮ</h2>

  <button class="menu-button" onclick="showScreen('fighters')">
    🥊 БІЙЦІ
  </button>

  <button class="menu-button" onclick="showScreen('modes')">
    ⚔️ ГРАТИ
  </button>

  <button class="menu-button" onclick="showScreen('shop')">
    🛒 МАГАЗИН
  </button>
</section>

<section id="fighters" class="screen">
  <h2>🥊 БІЙЦІ</h2>
  <div id="fighters-list"></div>
  <button class="menu-button back" onclick="showScreen('menu')">
    ⬅ НАЗАД
  </button>
</section>

<section id="modes" class="screen">
  <h2>⚔️ РЕЖИМИ ГРИ</h2>

  <button class="menu-button" onclick="showScreen('difficulty')">
    1️⃣ 1 НА 1
  </button>

  <button class="menu-button back" onclick="showScreen('menu')">
    ⬅ НАЗАД
  </button>
</section>

<section id="difficulty" class="screen">
  <h2>ОБЕРИ СКЛАДНІСТЬ</h2>

  <button class="menu-button" onclick="startGame('easy')">
    🟢 ЛЕГКО
  </button>

  <button class="menu-button" onclick="startGame('normal')">
    🔵 НОРМАЛЬНО
  </button>

  <button class="menu-button" onclick="startGame('hard')">
    🟠 ХАРДОВО
  </button>

  <button class="menu-button" onclick="startGame('extreme')">
    🔴 ЕКСТРЕМАЛЬНО
  </button>

  <button class="menu-button back" onclick="showScreen('modes')">
    ⬅ НАЗАД
  </button>
</section>

<section id="shop" class="screen">
  <h2>🛒 МАГАЗИН</h2>
  <div id="shop-list"></div>

  <button class="menu-button back" onclick="showScreen('menu')">
    ⬅ НАЗАД
  </button>
</section>

<section id="battle" class="screen">
  <h2>⚔️ БІЙ</h2>
  <div id="battle-content"></div>

  <button class="menu-button back" onclick="showScreen('menu')">
    🏠 МЕНЮ
  </button>
</section>

</main>

<footer>
  BATTLE BRAWL © 2026
</footer>
</body>
</html>
