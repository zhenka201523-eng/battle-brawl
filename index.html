
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#21143b">
<link rel="manifest" href="./manifest.webmanifest">
<title>BATTLE BRAWL 2.2</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:white;
  background:linear-gradient(135deg,#100b20,#28164b,#111a30);
  min-height:100vh;
}
header{
  text-align:center;
  padding:22px 10px;
  background:#1c1235;
  border-bottom:3px solid #a34cff;
}
header h1{
  margin:0;
  color:#d9a5ff;
  font-size:34px;
  text-shadow:0 0 15px #9b42ff;
}
header p{color:#c9b8df}
#currency{
  text-align:center;
  margin:15px;
  padding:12px;
  background:#352052;
  border:1px solid #a34cff;
  border-radius:12px;
  font-size:19px;
}
main{
  width:min(95%,700px);
  margin:20px auto;
}
.screen{display:none}
.screen.active{display:block}
h2{
  text-align:center;
  color:#d9a5ff;
}
.menu-button{
  display:block;
  width:100%;
  padding:16px;
  margin:12px 0;
  border:2px solid #a34cff;
  border-radius:14px;
  background:linear-gradient(135deg,#482477,#29204b);
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
.menu-button:active{transform:scale(.97)}
.menu-button:disabled{opacity:.5;cursor:not-allowed}
.back{
  background:#302344;
  border-color:#75618e;
}
.card{
  background:#241a3a;
  border:1px solid #7950a9;
  border-radius:15px;
  padding:15px;
  margin:12px 0;
  text-align:center;
}
.card h3{color:#d9a5ff}
.stats{
  display:flex;
  justify-content:space-around;
  flex-wrap:wrap;
  gap:8px;
}
.health{
  height:15px;
  background:#492b52;
  border-radius:20px;
  overflow:hidden;
  margin:10px 0;
}
.health-fill{
  height:100%;
  background:#51df85;
  width:100%;
  transition:width .2s;
}
footer{
  text-align:center;
  padding:20px;
  color:#a99bbd;
}
@media(orientation:landscape){
  main{max-width:950px}
  #fighters-list,#shop-list{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }
}
</style>
</head>

<body>
<header>
  <h1>⚔️ BATTLE BRAWL</h1>
  <p>🎃 HALLOWEEN UPDATE — VERSION 2.2</p>
</header>

<div id="currency">
  💜 Flayyers: <span id="coins">0</span>
</div>

<main>

<section id="menu" class="screen active">
  <h2>ГОЛОВНЕ МЕНЮ</h2>
  <button class="menu-button" onclick="showScreen('fighters')">🥊 БІЙЦІ</button>
  <button class="menu-button" onclick="showScreen('modes')">⚔️ ГРАТИ</button>
  <button class="menu-button" onclick="showScreen('shop')">🛒 МАГАЗИН</button>
</section>

<section id="fighters" class="screen">
  <h2>🥊 БІЙЦІ</h2>
  <div id="fighters-list"></div>
  <button class="menu-button back" onclick="showScreen('menu')">⬅ НАЗАД</button>
</section>

<section id="modes" class="screen">
  <h2>⚔️ РЕЖИМИ ГРИ</h2>
  <button class="menu-button" onclick="showScreen('difficulty')">1️⃣ 1 НА 1</button>
  <button class="menu-button back" onclick="showScreen('menu')">⬅ НАЗАД</button>
</section>

<section id="difficulty" class="screen">
  <h2>🎚️ СКЛАДНІСТЬ</h2>
  <button class="menu-button" onclick="startGame('easy')">🟢 ЛЕГКО</button>
  <button class="menu-button" onclick="startGame('normal')">🔵 НОРМАЛЬНО</button>
  <button class="menu-button" onclick="startGame('hard')">🟠 ХАРДОВО</button>
  <button class="menu-button" onclick="startGame('extreme')">🔴 ЕКСТРЕМАЛЬНО</button>
  <button class="menu-button back" onclick="showScreen('modes')">⬅ НАЗАД</button>
</section>

<section id="shop" class="screen">
  <h2>🛒 МАГАЗИН</h2>
  <div id="shop-list"></div>
  <button class="menu-button back" onclick="showScreen('menu')">⬅ НАЗАД</button>
</section>

<section id="battle" class="screen">
  <h2>⚔️ БІЙ</h2>
  <div id="battle-content"></div>
  <button class="menu-button back" onclick="showScreen('menu')">🏠 МЕНЮ</button>
</section>

</main>

<footer>BATTLE BRAWL © 2026</footer>

<script>
const fighters = [
  {name:"Меоад",emoji:"🐱",rarity:"Звичайний",attack:2,hp:30},
  {name:"Джемені",emoji:"💎",rarity:"Надрідкісний",attack:45,hp:56},
  {name:"Жед",emoji:"🐉",rarity:"Міфічний",attack:68,hp:100},
  {name:"Chat GPT",emoji:"🤖",rarity:"Легендарний",attack:95,hp:300}
];

const boxes = [
  "📦 Common Box",
  "💙 Rare Box",
  "💜 Epic Box",
  "🔮 Mythic Box",
  "👑 Legendary Box"
];

let selectedFighter = 0;
let playerHP = 0;
let enemyHP = 0;
let enemyMaxHP = 0;
let enemyAttack = 0;
let specialUsed = false;
let defending = false;
let gameOver = false;

function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>{
    s.classList.remove("active");
  });
  document.getElementById(id).classList.add("active");
}

function renderFighters(){
  const list = document.getElementById("fighters-list");
  list.innerHTML = "";

  fighters.forEach((f,i)=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${f.emoji} ${f.name}</h3>
      <p>Рідкість: ${f.rarity}</p>
      <div class="stats">
        <span>❤️ ${f.hp} HP</span>
        <span>⚔️ ${f.attack} атака</span>
      </div>
      <button class="menu-button" onclick="selectFighter(${i})">
        ${selectedFighter===i?"✅ ОБРАНО":"ОБРАТИ"}
      </button>
    `;
    list.appendChild(card);
  });
}

function selectFighter(i){
  selectedFighter = i;
  renderFighters();
}

function renderShop(){
  const list = document.getElementById("shop-list");
  list.innerHTML = "";

  boxes.forEach(name=>{
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <h3>${name}</h3>
      <p>Вміст з'явиться в наступних оновленнях.</p>
      <button class="menu-button" disabled>🔒 СКОРО</button>
    `;
    list.appendChild(card);
  });

  const skins = document.createElement("div");
  skins.className = "card";
  skins.innerHTML = `
    <h3>🎨 СКІНИ</h3>
    <p>Нові образи бійців — скоро!</p>
  `;
  list.appendChild(skins);
}

const difficulties = {
  easy:{name:"Легко",hp:50,attack:5},
  normal:{name:"Нормально",hp:100,attack:15},
  hard:{name:"Хардово",hp:150,attack:25},
  extreme:{name:"Екстремально",hp:250,attack:40}
};

function startGame(level){
  const enemy = difficulties[level];

  playerHP = fighters[selectedFighter].hp;
  enemyHP = enemy.hp;
  enemyMaxHP = enemy.hp;
  enemyAttack = enemy.attack;
  specialUsed = false;
  defending = false;
  gameOver = false;

  showScreen("battle");
  renderBattle(enemy.name);
}

function renderBattle(levelName=""){
  const f = fighters[selectedFighter];

  document.getElementById("battle-content").innerHTML = `
    <div class="card">
      <h3>${f.emoji} ${f.name}</h3>
      <p>❤️ Гравець: <span id="player-hp">${playerHP}</span> / ${f.hp}</p>
      <div class="health">
        <div class="health-fill" id="player-bar"
          style="width:${playerHP/f.hp*100}%"></div>
      </div>
    </div>

    <div class="card">
      <h3>👹 Супротивник</h3>
      <p>Складність: ${levelName}</p>
      <p>❤️ Ворог: <span id="enemy-hp">${enemyHP}</span> / ${enemyMaxHP}</p>
      <div class="health">
        <div class="health-fill" id="enemy-bar"
          style="width:${enemyHP/enemyMaxHP*100}%"></div>
      </div>
    </div>

    <div class="card">
      <button class="menu-button" onclick="playerAttack()">⚔️ АТАКА</button>
      <button class="menu-button" id="special-button"
        onclick="playerSpecial()">💥 СУПЕРАТАКА</button>
      <button class="menu-button" onclick="playerDefend()">🛡️ ЗАХИСТ</button>
      <p id="battle-message">Бій починається!</p>
    </div>
  `;
}

function updateBattle(){
  const f = fighters[selectedFighter];

  document.getElementById("player-hp").textContent = playerHP;
  document.getElementById("enemy-hp").textContent = enemyHP;

  document.getElementById("player-bar").style.width =
    Math.max(0,playerHP/f.hp*100)+"%";

  document.getElementById("enemy-bar").style.width =
    Math.max(0,enemyHP/enemyMaxHP*100)+"%";

  document.getElementById("special-button").disabled = specialUsed;
}

function finishBattle(playerWon){
  gameOver = true;

  const message = document.getElementById("battle-message");

  if(playerWon){
    message.textContent = "🏆 ПЕРЕМОГА!";
    document.getElementById("coins").textContent =
      Number(document.getElementById("coins").textContent)+10;
  }else{
    message.textContent = "💀 ПОРАЗКА!";
  }
}

function enemyTurn(){
  if(gameOver) return;

  let damage = enemyAttack;

  if(defending){
    damage = Math.ceil(damage/2);
    defending = false;
  }

  playerHP = Math.max(0,playerHP-damage);

  if(playerHP<=0){
    updateBattle();
    finishBattle(false);
    return;
  }

  updateBattle();
}

function playerAttack(){
  if(gameOver) return;

  enemyHP = Math.max(0,enemyHP-fighters[selectedFighter].attack);
  updateBattle();

  if(enemyHP<=0){
    finishBattle(true);
    return;
  }

  enemyTurn();
}

function playerSpecial(){
  if(gameOver || specialUsed) return;

  specialUsed = true;
  const damage = Math.round(fighters[selectedFighter].attack*2);

  enemyHP = Math.max(0,enemyHP-damage);
  updateBattle();

  if(enemyHP<=0){
    finishBattle(true);
    return;
  }

  enemyTurn();
}

function playerDefend(){
  if(gameOver) return;

  defending = true;
  document.getElementById("battle-message").textContent =
    "🛡️ Ти захищаєшся!";

  enemyTurn();
}

renderFighters();
renderShop();
navigator.serviceWorker.register("./sw.js")
  });
}
</script>

</body>
</html>
